organization: cotique
module: bitbucket-provider
type: plugin
description: Bitbucket Cloud connector for Kickside Data Sync — a kickside.connection provider (app password or access token) plus a kickside.data:pullable source publishing a repository's pull requests as an automation port.
# Pick the license your distribution requires (kickside platform modules use BUSL-1.1).
license: MIT
repository: https://github.com/cotique/kickside-bitbucket-provider
homepage: https://wippy.ai
keywords:
  - kickside
  - bitbucket-provider
embed:
  - cotique.bitbucket_provider:ui_fs
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
