organization: cotique
module: bitbucket
type: plugin
description: Read-only Bitbucket Cloud connector — a repository access token connection provider plus a pull-request pull source for Kickside Data Sync.
# Pick the license your distribution requires (kickside platform modules use BUSL-1.1).
license: MIT
repository: https://github.com/cotique/kickside-bitbucket-provider
homepage: https://wippy.ai
keywords:
  - kickside
  - bitbucket
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
