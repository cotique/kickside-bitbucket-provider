version: "1.0"
namespace: cotique.bitbucket.client

entries:
  # cotique.bitbucket.client:types
  - name: types
    kind: library.lua
    meta:
      comment: Shared constants for the Bitbucket Cloud client (base URL, auth modes, state mapping).
    source: file://types.lua

  # cotique.bitbucket.client:output
  - name: output
    kind: library.lua
    meta:
      comment: Safe output encoding — redacts credential-shaped fields before anything reaches a log line or error message.
    source: file://output.lua

  # cotique.bitbucket.client:data_error
  - name: data_error
    kind: library.lua
    meta:
      comment: Maps HTTP/transport failures onto the kickside.data DataError envelope (code, message, retriable, scope).
    source: file://data_error.lua
    imports:
      types: cotique.bitbucket.client:types

  # cotique.bitbucket.client:api
  - name: api
    kind: library.lua
    meta:
      comment: Low-level Bitbucket Cloud REST client — builds requests, sets the auth header, parses JSON, returns DataError on failure.
    source: file://api.lua
    modules:
      - http_client
      - json
      - base64
    imports:
      data_error: cotique.bitbucket.client:data_error
      types: cotique.bitbucket.client:types

  # cotique.bitbucket.client:transport
  - name: transport
    kind: library.lua
    meta:
      comment: Actor-scoped resolver — given a component_id, loads private_context and hands back a configured client:api instance.
    source: file://transport.lua
    imports:
      component: kickside.component:component
      api: cotique.bitbucket.client:api
      types: cotique.bitbucket.client:types

  # Colocated *_test.lua files for this slice live in test/src/ (the
  # standalone harness), not here. CONFIRMED empirically during this build
  # (see BUILD-NOTES.md): this module's own wippy.yaml declares
  # `exclude_meta.type: [test]`, and that rule is applied even when the
  # module is loaded through the harness's workspace replacement — a
  # meta.type: test entry registered in this file never reaches the
  # registry the harness's `wippy test` run sees, at all (confirmed via
  # `wippy registry list --meta "type=test"` returning zero of this
  # module's own entries, and appearing only once exclude_meta was
  # temporarily removed). The template's own original test/src/log_test.lua
  # already used this exact pattern (test file in the harness, importing
  # the production entry by id) — this module follows the same precedent
  # rather than the more generic "colocate next to source" wording in
  # docs/kickside-development/12-module-layout.md and 13-testing.md.
