version: "1.0"
namespace: cotique.bitbucket

entries:
  # cotique.bitbucket:definition
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: Bitbucket Connector
      description: Bitbucket Cloud connector — a repository access token connection provider, a read-only pull-request pull source for Kickside Data Sync, and agent-tool traits for limited interactive pull-request read/write access (create/update/decline a pull request, comment on one). The Data Sync source itself stays read-only; it never creates, updates, merges, comments on, approves, or labels anything. Never merges, approves, or deletes anything, and never touches repository files, branches, releases, settings, collaborators, or pipelines.

  # cotique.bitbucket:dep.kickside.contract
  - version: "*"
    name: dep.kickside.contract
    kind: ns.dependency
    meta:
      comment: Base contracts (kickside.contract:component/deletable, kickside.data:pullable) this module implements.
    component: kickside/contract

  # cotique.bitbucket:dep.kickside.connection
  - version: "*"
    name: dep.kickside.connection
    kind: ns.dependency
    meta:
      comment: kickside.connection:connection contract plus base_connection get_status/delete boilerplate.
    component: kickside/connection

  # cotique.bitbucket:dep.kickside.component
  - version: "*"
    name: dep.kickside.component
    kind: ns.dependency
    meta:
      comment: Component client library (get_private_context) used to read connection credentials.
    component: kickside/component

