version: "1.0"
namespace: cotique.bitbucket_provider.connection

entries:
  # cotique.bitbucket_provider.connection:connection_lib
  - name: connection_lib
    kind: library.lua
    meta:
      comment: Shared connection helper — resolves component_id from ambient context and builds a configured API client.
    source: file://connection_lib.lua
    modules:
      - ctx
    imports:
      transport: cotique.bitbucket_provider.client:transport

  # cotique.bitbucket_provider.connection:get_status
  - name: get_status
    kind: function.lua
    meta:
      comment: kickside.contract:component get_status — delegates to kickside.connection:base_connection boilerplate.
    source: file://get_status.lua
    imports:
      base_connection: kickside.connection:base_connection
    method: get_status

  # cotique.bitbucket_provider.connection:delete
  - name: delete
    kind: function.lua
    meta:
      comment: kickside.contract:deletable delete — delegates to kickside.connection:base_connection boilerplate.
    source: file://delete.lua
    imports:
      base_connection: kickside.connection:base_connection
    method: delete

  # cotique.bitbucket_provider.connection:test_connection
  - name: test_connection
    kind: function.lua
    meta:
      comment: kickside.connection:connection test_connection — live GET /user call proving the stored credential works.
    source: file://test_connection.lua
    imports:
      connection_lib: cotique.bitbucket_provider.connection:connection_lib
    method: test_connection

  # cotique.bitbucket_provider.connection:discover_resources
  - name: discover_resources
    kind: function.lua
    meta:
      comment: kickside.connection:connection discover_resources — lists accessible Bitbucket repositories.
    source: file://discover_resources.lua
    imports:
      connection_lib: cotique.bitbucket_provider.connection:connection_lib
      types: cotique.bitbucket_provider.client:types
    method: discover_resources

  # cotique.bitbucket_provider.connection:bitbucket_connection
  # The canonical credential-only provider binding shape, per
  # docs/kickside-development/04-connections-and-integrations.md "Minimal
  # Provider Example". Bitbucket Cloud only (api.bitbucket.org/2.0) — Server/
  # Data Center is a different API/auth model entirely and is out of scope
  # (see BUILD-NOTES.md).
  #
  # Single-field credential_schema, mirroring cotique/gitlab-provider's
  # `gitlab_connection` shape: Bitbucket Cloud app passwords are fully
  # deprecated (creation stopped 2025-09-09, brownout 2026-06-09..2026-07-27,
  # full removal completed 2026-07-28 — see BUILD-NOTES.md's dated entry).
  # Repository/workspace access tokens are now the only supported credential
  # mode, so the earlier two-mode `auth_mode` select + `required_if` fields
  # have been removed entirely — see BUILD-NOTES.md for what this replaces.
  - name: bitbucket_connection
    kind: contract.binding
    meta:
      title: Bitbucket
      icon: tabler:brand-bitbucket
      provider: bitbucket
      group: Developer
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: access_token
            label: Access token
            type: password
            required: true
            help: "Create one at a repository's own Settings > Security > Access tokens, scoped to Repositories: Read and Pull requests: Read only."
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: cotique.bitbucket_provider.connection:get_status
      - contract: kickside.connection:connection
        context_required: [component_id]
        methods:
          get_status: cotique.bitbucket_provider.connection:get_status
          test_connection: cotique.bitbucket_provider.connection:test_connection
          discover_resources: cotique.bitbucket_provider.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: cotique.bitbucket_provider.connection:delete

  # discover_resources_test.lua lives in test/src/ (the standalone harness),
  # not here — see the equivalent note in ../client/_index.yaml for why.
